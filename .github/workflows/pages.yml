name: Publish Pristine to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize portable paths and mobile header CTA
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('.')

          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')

              # Make same-directory pages and assets work both at a custom-domain
              # root and under GitHub Pages' /pristine-appliance-repair/ subpath.
              text = text.replace('href="/"', 'href="index.html"')
              text = text.replace('href="/assets/', 'href="assets/')
              text = text.replace('src="/assets/', 'src="assets/')
              text = text.replace('href="/site.webmanifest"', 'href="site.webmanifest"')
              text = text.replace('href="/dryer-repair.html', 'href="dryer-repair.html')
              text = text.replace('href="/dishwasher-repair.html', 'href="dishwasher-repair.html')
              text = text.replace('href="/stove-repair.html', 'href="stove-repair.html')
              text = text.replace('href="/contact.html', 'href="contact.html')
              text = text.replace('href="/privacy.html', 'href="privacy.html')
              text = text.replace('action="/contact.html', 'action="contact.html')

              page.write_text(text, encoding='utf-8')

          manifest = root / 'site.webmanifest'
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8')
              text = text.replace('"start_url": "/"', '"start_url": "./"')
              text = text.replace('"src": "/assets/', '"src": "assets/')
              manifest.write_text(text, encoding='utf-8')

          # The header CTA stays in the markup for desktop. Give the mobile hide
          # rule equal-or-greater specificity than the generic .button display
          # rule so the standalone CTA cannot appear beside the burger on phones.
          css = root / 'assets' / 'css' / 'site.css'
          if css.exists():
              text = css.read_text(encoding='utf-8')
              while '.button.button.header-cta' in text:
                  text = text.replace('.button.button.header-cta', '.button.header-cta')
              text = text.replace('\n.header-cta { display: none; }', '\n.button.header-cta { display: none; }')
              text = text.replace('\n  .header-cta { display: inline-flex; min-height: 42px; padding: .62rem .9rem; font-size: .82rem; }', '\n  .button.header-cta { display: inline-flex; min-height: 42px; padding: .62rem .9rem; font-size: .82rem; }')
              css.write_text(text, encoding='utf-8')

          # Fail the build if a local root-relative dependency sneaks through.
          problems = []
          for page in root.glob('*.html'):
              for number, line in enumerate(page.read_text(encoding='utf-8').splitlines(), 1):
                  if 'href="/' in line or 'src="/' in line or 'action="/' in line:
                      problems.append(f'{page}:{number}: {line.strip()}')

          if problems:
              raise SystemExit('Root-relative local paths remain:\n' + '\n'.join(problems))
          PY

      - name: Commit normalized source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dryer-repair.html dishwasher-repair.html stove-repair.html contact.html privacy.html site.webmanifest assets/css/site.css
          if ! git diff --cached --quiet; then
            git commit -m "fix: normalize Pages paths and mobile header CTA"
            git push origin HEAD:main
          fi

      - name: Build static Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html dryer-repair.html dishwasher-repair.html stove-repair.html contact.html privacy.html robots.txt sitemap.xml llms.txt site.webmanifest _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
