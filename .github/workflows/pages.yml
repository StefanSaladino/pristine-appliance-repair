name: Publish Pristine to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate route-specific social cards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('.')
          image_dir = root / 'assets' / 'images'
          image_dir.mkdir(parents=True, exist_ok=True)
          logo_path = image_dir / 'logo-mark-appliance.png'

          cards = {
              'index.html': ('og-home.png', 'Appliance Repair', 'Dryer & Dishwasher Repair · Toronto & GTA'),
              'dryer-repair.html': ('og-dryer-repair.png', 'Dryer Repair', 'In-home repair · Toronto & GTA'),
              'dishwasher-repair.html': ('og-dishwasher-repair.png', 'Dishwasher Repair', 'In-home repair · Toronto & GTA'),
              'contact.html': ('og-contact.png', 'Contact Pristine', 'Appliance Repair · Toronto & GTA'),
          }

          bg = '#090b0d'
          paper = '#f5f6f7'
          muted = '#b6bcc4'
          copper = '#b87333'
          copper_light = '#d69a67'

          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          title_font = ImageFont.truetype(bold, 78)
          brand_font = ImageFont.truetype(bold, 30)
          sub_font = ImageFont.truetype(regular, 31)
          small_font = ImageFont.truetype(regular, 23)

          logo = Image.open(logo_path).convert('RGBA')
          logo.thumbnail((92, 118), Image.Resampling.LANCZOS)

          for html_name, (filename, title, subtitle) in cards.items():
              card = Image.new('RGB', (1200, 630), bg)
              draw = ImageDraw.Draw(card)

              draw.rectangle((0, 0, 18, 630), fill=copper)
              draw.rectangle((74, 502, 1126, 504), fill=copper)
              card.paste(logo, (78, 67), logo)

              draw.text((194, 74), 'PRISTINE', font=brand_font, fill=paper)
              draw.text((194, 113), 'APPLIANCE REPAIR', font=small_font, fill=copper_light)
              draw.text((78, 244), title, font=title_font, fill=paper)
              draw.text((82, 359), subtitle, font=sub_font, fill=muted)
              draw.text((82, 535), 'pristineappliance.ca', font=small_font, fill=muted)

              card.save(image_dir / filename, format='PNG', optimize=True)

              page = root / html_name
              text = page.read_text(encoding='utf-8')
              text = text.replace('og-pristine.png', filename)
              marker = f'<meta property="og:image" content="https://pristineappliance.ca/assets/images/{filename}">'
              secure = f'<meta property="og:image:secure_url" content="https://pristineappliance.ca/assets/images/{filename}">'
              if marker in text and 'og:image:secure_url' not in text:
                  text = text.replace(marker, marker + '\n  ' + secure, 1)
              page.write_text(text, encoding='utf-8')

          old = image_dir / 'og-pristine.png'
          if old.exists():
              old.unlink()
          PY

      - name: Commit generated social-card layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dryer-repair.html dishwasher-repair.html contact.html assets/images
          if ! git diff --cached --quiet; then
            git commit -m "feat: add route-specific social cards"
            git push origin HEAD:main
          fi

      - name: Build GitHub Pages preview
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html dryer-repair.html dishwasher-repair.html contact.html robots.txt sitemap.xml llms.txt site.webmanifest _site/
          cp -R assets _site/assets

          python <<'PY'
          from pathlib import Path
          base = '/pristine-appliance-repair/'
          for path in Path('_site').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('href="/', f'href="{base}')
              text = text.replace('src="/', f'src="{base}')
              text = text.replace('action="/', f'action="{base}')
              path.write_text(text, encoding='utf-8')

          js = Path('_site/assets/js/site.js')
          if js.exists():
              text = js.read_text(encoding='utf-8')
              text = text.replace("'/contact.html#request-form'", "'/pristine-appliance-repair/contact.html#request-form'")
              text = text.replace('"/contact.html#request-form"', '"/pristine-appliance-repair/contact.html#request-form"')
              js.write_text(text, encoding='utf-8')

          manifest = Path('_site/site.webmanifest')
          if manifest.exists():
              text = manifest.read_text(encoding='utf-8')
              text = text.replace('"/assets/', '"/pristine-appliance-repair/assets/')
              text = text.replace('"start_url": "/"', '"start_url": "/pristine-appliance-repair/"')
              manifest.write_text(text, encoding='utf-8')
          PY

      - name: Check Pages availability
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled. Continuing with deployment."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet (HTTP ${status})."
            echo "Enable GitHub Pages once in Settings > Pages > Source: GitHub Actions, then the next push or manual workflow run will deploy automatically."
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
